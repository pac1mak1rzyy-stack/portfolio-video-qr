<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>作品集视频</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #111; }
  body { display: flex; align-items: center; justify-content: center; }
  .wrap {
    position: relative;
    width: 100%;
    max-width: 480px;
    background: #000;
    line-height: 0;
  }
  video {
    width: 100%;
    height: auto;
    display: block;
    background: #000;
    object-fit: contain;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.35);
    cursor: pointer;
    transition: opacity .25s ease, visibility .25s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(255,255,255,0.95);
    color: #111;
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <video id="v" src="final.mp4" poster="poster.jpg" playsinline autoplay muted loop controls preload="auto"></video>
    <div class="overlay" id="overlay" aria-label="开启声音并播放">
      <div class="btn">🔊 点击开启声音</div>
    </div>
  </div>
  <script>
    const v = document.getElementById('v');
    const o = document.getElementById('overlay');
    function unlock() {
      v.muted = false;
      v.play().catch(() => {});
      o.classList.add('hidden');
    }
    o.addEventListener('click', unlock);
    v.addEventListener('play', () => o.classList.add('hidden'));
    v.addEventListener('pause', () => {
      if (!v.muted) o.classList.remove('hidden');
    });
    // 有声音后，自动隐藏遮罩
    v.addEventListener('volumechange', () => {
      if (!v.muted) o.classList.add('hidden');
    });
    // 自动播放被拦截时，让用户点遮罩也可以播放
    v.play().catch(() => o.classList.remove('hidden'));
  </script>
</body>
</html>
