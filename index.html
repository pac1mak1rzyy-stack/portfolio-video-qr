<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>作品集视频</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  video {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    background: #000;
    display: block;
  }
</style>
</head>
<body>
  <div class="wrap">
    <video id="vid"
      src="https://cdn.jsdelivr.net/gh/pac1mak1rzyy-stack/portfolio-video-qr@378c12daf2ca34d30165955452d608ef30770ab2/final.mp4"
      poster="https://cdn.jsdelivr.net/gh/pac1mak1rzyy-stack/portfolio-video-qr@378c12daf2ca34d30165955452d608ef30770ab2/poster.jpg"
      controls autoplay muted loop playsinline webkit-playsinline preload="auto"></video>
  </div>
  <script>
    (function () {
      var vid = document.getElementById('vid');
      function tryPlay() {
        var p = vid.play();
        if (p && p.catch) { p.catch(function () {}); }
      }
      // 能自动播就秒播；被拦截时用户点原生控件上的播放键即可
      tryPlay();
      vid.addEventListener('canplay', function () { tryPlay(); }, { once: true });
    })();
  </script>
</body>
</html>
