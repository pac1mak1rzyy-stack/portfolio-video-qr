<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>作品集 · 动效演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  #wrap {
    position: relative;
    width: 100vw; max-width: 560px;
    height: 100vh; max-height: 100vh;
    background: #000;
  }
  video {
    width: 100%; height: 100%;
    object-fit: contain;
    background: #000;
    display: block;
  }
  #loader {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; gap: 16px;
    align-items: center; justify-content: center;
    color: rgba(255,255,255,.75); font-size: 14px; letter-spacing: 1px;
    background: #000; z-index: 5;
    transition: opacity .4s ease;
  }
  #loader.hide { opacity: 0; pointer-events: none; }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.15); border-top-color: rgba(255,255,255,.8);
    animation: sp .8s linear infinite;
  }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="wrap">
  <video id="vid" controls muted autoplay loop playsinline webkit-playsinline preload="auto"
         poster="https://fastly.jsdelivr.net/gh/pac1mak1rzyy-stack/portfolio-video-qr@ebd13be41d9066b262ba3e6be50f9975a203a9ab/poster.jpg"></video>
  <div id="loader"><div class="spin"></div><div>视频加载中…</div></div>
</div>
<script>
(function () {
  var PIN = 'ebd13be41d9066b262ba3e6be50f9975a203a9ab';
  var GH = 'pac1mak1rzyy-stack/portfolio-video-qr';
  // 多线路竞速：谁先返回数据就用谁
  var CANDIDATES = [
    'https://gcore.jsdelivr.net/gh/' + GH + '@' + PIN + '/final.mp4',
    'https://cdn.jsdelivr.net/gh/' + GH + '@' + PIN + '/final.mp4',
    'https://fastly.jsdelivr.net/gh/' + GH + '@' + PIN + '/final.mp4',
    'https://testingcf.jsdelivr.net/gh/' + GH + '@' + PIN + '/final.mp4',
    'https://pac1mak1rzyy-stack.github.io/portfolio-video-qr/final.mp4'
  ];

  var vid = document.getElementById('vid');
  var loader = document.getElementById('loader');
  var done = false;

  function useSrc(url) {
    if (done) return;
    done = true;
    vid.src = url;
    vid.load();
    var p = vid.play();
    if (p && p.catch) p.catch(function () {});
    hideLoaderSoon();
  }

  function hideLoaderSoon() {
    // 拿到可播放数据就隐藏 loader
    var onHide = function () { loader.classList.add('hide'); };
    vid.addEventListener('loadeddata', onHide, { once: true });
    vid.addEventListener('canplay', onHide, { once: true });
    setTimeout(onHide, 9000); // 兜底
  }

  function probe(url) {
    return fetch(url, {
      method: 'GET',
      headers: { 'Range': 'bytes=0-1023' },
      cache: 'no-store',
      referrerPolicy: 'no-referrer'
    }).then(function (r) {
      if (r.ok || r.status === 206) return url;
      throw new Error('status ' + r.status);
    });
  }

  // 竞速：任一成功即用；全部失败则依次串行兜底
  var timeout = function (p, ms) {
    return Promise.race([
      p,
      new Promise(function (_, rej) { setTimeout(function () { rej(new Error('timeout')); }, ms); })
    ]);
  };

  CANDIDATES.forEach(function (url) {
    timeout(probe(url), 5000).then(function (u) { useSrc(u); }).catch(function () {});
  });

  // 全部超时的兜底：12秒后直接用同源 github.io 地址
  setTimeout(function () { useSrc(CANDIDATES[CANDIDATES.length - 1]); }, 12000);
})();
</script>
</body>
</html>
