<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>作品集视频</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0e0e10; }
  body { display: flex; align-items: center; justify-content: center; }
  .wrap { width: 100%; max-width: 480px; position: relative; }
  video { width: 100%; height: auto; display: block; background: #000; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.35); cursor: pointer; z-index: 5; }
  #overlay.hidden { display: none; }
  #overlay .play { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center; }
  #overlay .play::before { content: ""; width: 0; height: 0; margin-left: 6px; border-left: 24px solid #111; border-top: 15px solid transparent; border-bottom: 15px solid transparent; }
</style>
</head>
<body>
  <div class="wrap">
    <video id="vid" controls autoplay muted loop playsinline poster="poster.jpg" preload="auto">
      <source src="https://cdn.jsdelivr.net/gh/pac1mak1rzyy-stack/portfolio-video-qr@main/final.mp4" type="video/mp4">
      <source src="final.mp4" type="video/mp4">
    </video>
    <div id="overlay"><div class="play"></div></div>
  </div>
  <script>
    const vid = document.getElementById('vid');
    const overlay = document.getElementById('overlay');
    vid.play().then(() => overlay.classList.add('hidden')).catch(() => overlay.classList.remove('hidden'));
    overlay.addEventListener('click', () => { vid.play(); overlay.classList.add('hidden'); });
    vid.addEventListener('playing', () => overlay.classList.add('hidden'));
  </script>
</body>
</html>
