<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>作品集视频</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;}
  #wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
  video{width:100%;height:100%;object-fit:contain;background:#000;}
  #spinner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:14px;background:rgba(0,0,0,.35);transition:opacity .3s;z-index:2;}
  #spinner.hide{opacity:0;pointer-events:none;}
  .ring{width:32px;height:32px;margin-right:10px;border:3px solid rgba(255,255,255,.3);
    border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  #err{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#ffd0d0;
    font-size:13px;line-height:1.5;padding:0 20px;display:none;z-index:3;}
</style>
</head>
<body>
<div id="wrap">
  <video id="vid" controls autoplay muted loop playsinline preload="auto"
    poster="https://cdn.jsdelivr.net/gh/pac1mak1rzyy-stack/portfolio-video-qr@2dc7d290d9650bdce629e08a49ec6338369cfd6b/poster.jpg">
    您的浏览器不支持视频播放，请升级浏览器。
  </video>
  <div id="spinner"><div class="ring"></div><span>视频加载中…</span></div>
  <div id="err"></div>
</div>
<script>
  var VIDEO = "https://cdn.jsdelivr.net/gh/pac1mak1rzyy-stack/portfolio-video-qr@2dc7d290d9650bdce629e08a49ec6338369cfd6b/final.mp4";
  var FALLBACK = "https://pac1mak1rzyy-stack.github.io/portfolio-video-qr/final.mp4";
  var vid = document.getElementById('vid');
  var spin = document.getElementById('spinner');
  var err = document.getElementById('err');
  var triedFallback = false;

  function hideSpin(){ spin.classList.add('hide'); }

  vid.addEventListener('playing', hideSpin);
  vid.addEventListener('error', function(){
    if(!triedFallback){
      triedFallback = true;
      err.style.display = 'block';
      err.textContent = '主线路较慢，正在切换备用线路…';
      vid.src = FALLBACK;
      vid.load();
      vid.play().catch(function(){});
    } else {
      err.textContent = '视频加载失败，请检查网络后刷新页面重试。';
    }
  });

  // 8 秒仍未可播，主动切备用线路
  setTimeout(function(){
    if(!triedFallback && vid.readyState < 3){
      triedFallback = true;
      err.style.display = 'block';
      err.textContent = '主线路较慢，正在切换备用线路…';
      vid.src = FALLBACK;
      vid.load();
      vid.play().catch(function(){});
    }
  }, 8000);

  vid.play().catch(function(){}); // 自动播放被拦截则等用户点播放键
</script>
</body>
</html>
